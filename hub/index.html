<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>周逸化學工作室</title>
<style>
  :root{--bg:#0d1322;--ink:#e8ecf4;--mute:#97a3b8;--card:#182035;--line:#2a3550}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% 30%,#172036 0%,var(--bg) 70%);color:var(--ink);font:15px/1.6 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}
  header{max-width:1240px;margin:0 auto;padding:22px 16px 0}
  h1{margin:0;font-size:24px;letter-spacing:.06em}
  .sub{color:var(--mute);font-size:13px}
  .rooms{max-width:1240px;margin:0 auto;padding:8px 8px 0;display:grid;grid-template-columns:540fr 660fr;gap:12px;align-items:start}
  @media (max-width:860px){.rooms{grid-template-columns:1fr}}
  .room{position:relative}
  .room h2{margin:8px 8px 0;font-size:17px;display:flex;align-items:center;gap:8px}
  .room h2 .tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;color:#0b1220;background:var(--c)}
  .room .note{margin:0 8px;color:var(--mute);font-size:12px}
  svg{width:100%;height:auto;display:block}
  .zone{cursor:pointer}
  .zone .lift{transition:transform .18s ease}
  .zone:hover .lift,.zone:focus .lift{transform:translateY(-5px)}
  .zone:hover .rug,.zone:focus .rug{filter:brightness(1.3) drop-shadow(0 0 10px var(--glow))}
  .zone:focus{outline:none}
  .zone .hit{fill:transparent;stroke:none}
  .zone .ring{fill:none;stroke:var(--glow);stroke-width:.14;opacity:.55;animation:pulse 2.2s ease-in-out infinite}
  .zone:hover .ring,.zone:focus .ring{opacity:0;animation:none}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}
  .badge{opacity:0;transition:opacity .15s,transform .15s;transform:translateY(4px);cursor:pointer}
  .badge.hot,.badge:hover,.badge:focus{opacity:1;transform:translateY(0)}
  .badge text{font-weight:800;pointer-events:none}
  @media (hover:none){.badge{opacity:1;transform:none}.zone .ring{animation:none;opacity:.5}}
  .tip{position:absolute;pointer-events:none;background:#020617f2;border:1px solid #334155;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;opacity:0;transition:opacity .12s;max-width:260px;z-index:5}
  .list{margin:6px 8px 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .list a{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 12px;color:var(--ink);text-decoration:none}
  .list a:hover{border-color:var(--c)}
  .list b{display:block;font-size:14px}
  .list span{color:var(--mute);font-size:12px}
  .guide{float:right;margin:2px 0 8px 12px;display:flex;flex-direction:column;align-items:center;background:#fbbf24;color:#0b1220;font-weight:800;font-size:16px;text-decoration:none;border-radius:12px;padding:8px 16px;box-shadow:0 0 18px #fbbf2455}
  .guide small{font-weight:600;font-size:11px}
  .guide:hover{filter:brightness(1.1)}
  footer{text-align:center;color:var(--mute);font-size:12px;padding:8px 16px 24px}
</style>
</head>
<body>
<header>
  <a class="guide" href="../guide/">📖 使用說明<small>第一次來先看這裡</small></a>
  <h1>周逸化學工作室</h1>
  <div class="sub">左邊是公領域（公開網站），右邊是私領域（內部用，需授權帳號）。發光框起來的工作區整塊都可以點，會在新分頁開啟。</div>
</header>
<div class="rooms">
  <div class="room" id="pub" style="--c:#4ade80"><h2>公領域 <span class="tag">公開</span></h2><div class="note">任何人都能看</div><svg viewBox="230 -10 540 450"></svg><div class="tip"></div><div class="list"></div></div>
  <div class="room" id="pri" style="--c:#f87171"><h2>私領域 <span class="tag">🔒 不公開</span></h2><div class="note">老師內部用，連結需要授權帳號才讀得到</div><svg viewBox="110 -10 780 590"></svg><div class="tip"></div><div class="list"></div></div>
</div>
<footer>周逸化學專用</footer>
<script>
/* ===== 連結表：網址或名稱有變動只改這裡 ===== */
const ROOMS = {
  pub: { N:12, sign:"公領域", sub:"PUBLIC", accent:"#4ade80", sites:[
    {name:"化學奧林匹亞初選", desc:"化奧初選歷屆原卷目錄",
     url:"https://easontseng56.github.io/chem-olympiad/", color:"#c084fc", gx:1, gy:1, prop:"flask"},
    {name:"新竹區高中化學段考題庫", desc:"竹中化學段考考古題，各校段考卷下載",
     url:"https://easontseng56.github.io/chem-exam/", color:"#2dd4bf", gx:6.2, gy:1, prop:"shelf"},
  ]},
  pri: { N:18, sign:"私領域", sub:"PRIVATE", accent:"#f87171", sites:[
    {name:"模考內訓網站", desc:"學測、分科模考原卷（內部使用）",
     url:"https://easontseng56.github.io/private-mock/", color:"#60a5fa", gx:1, gy:1, prop:"board"},
    {name:"離線出題系統", desc:"依章節、Tier、難度選題出卷（需 Google 登入）",
     url:"https://easontseng56.github.io/qbank/", color:"#fbbf24", gx:6.6, gy:1, prop:"printer"},
    {name:"題庫勘誤系統", desc:"回報題目、答案、詳解錯誤，追蹤處理進度（Google 登入）",
     url:"https://easontseng56.github.io/qbank/errata/", color:"#fb923c", gx:12.2, gy:1, prop:"folder"},
    {name:"段考卷目錄試算表", desc:"老師內部用，只限受邀者",
     url:"https://docs.google.com/spreadsheets/d/1TeFXDjy5hkq85gOTNsOu_J8dZ8P5HBbti2NjygFK86c/edit", color:"#34d399", gx:1, gy:9, prop:"sheet"},
    {name:"題庫池控制台", desc:"上傳考卷到 01_待處理、同步狀態、儀表板（Google 登入）",
     url:"https://easontseng56.github.io/qbank/console/", color:"#f87171", gx:12.2, gy:9, prop:"console"},
  ]},
};
/* ============================================ */

const NS="http://www.w3.org/2000/svg", C=Math.cos(Math.PI/6), S=24, WH=5, OX=500, OY=120;
let N=12, svg=null;
const P=(x,y,z=0)=>[OX+(x-y)*C*S, OY+(x+y)*0.5*S - z*S];
const pts=a=>a.map(p=>p.join(",")).join(" ");
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return `rgb(${m(r)},${m(g)},${m(b)})`}
const floorT=`matrix(${C*S},${.5*S},${-C*S},${.5*S},${OX},${OY})`;
const backT=`matrix(${C*S},${.5*S},0,${-S},${OX},${OY})`;
const leftT=`matrix(${-C*S},${.5*S},0,${-S},${OX},${OY})`;
function box(g,x,y,z,w,d,h,col,o={}){
  el("polygon",{points:pts([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)]),fill:o.L||shade(col,-.22)},g);
  el("polygon",{points:pts([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)]),fill:o.R||shade(col,-.45)},g);
  el("polygon",{points:pts([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)]),fill:o.T||col},g);
}
function faceL(g,x,y,z){return el("g",{transform:`matrix(${C*S},${.5*S},0,${-S},${P(x,y,z)[0]},${P(x,y,z)[1]})`},g)}
function shadow(g,x,y,w,d){const q=el("g",{transform:floorT,opacity:.25},g);el("ellipse",{cx:x+w/2,cy:y+d/2,rx:w/2+.25,ry:d/2+.25,fill:"#000"},q)}

/* ---------- 家具 ---------- */
function desk(g,x,y,w,d,top="#e5e7eb",legs="#94a3b8"){
  shadow(g,x,y,w,d);
  box(g,x+.1,y+.1,0,.15,.15,1.0,legs);box(g,x+w-.25,y+.1,0,.15,.15,1.0,legs);
  box(g,x+.1,y+d-.25,0,.15,.15,1.0,legs);box(g,x+w-.25,y+d-.25,0,.15,.15,1.0,legs);
  box(g,x,y,1.0,w,d,.12,top);
}
function monitor(g,x,y,z,col,w=.9,kind="lines"){
  box(g,x+w/2-.15,y+.3,z,.3,.25,.1,"#475569");
  box(g,x+w/2-.03,y+.4,z+.1,.06,.06,.25,"#64748b");
  box(g,x,y+.42,z+.35,w,.06,.6,"#1e293b");
  const f=faceL(g,x,y+.48,z+.35);
  el("rect",{x:.05,y:.05,width:w-.1,height:.5,fill:"#0b1220"},f);
  el("rect",{x:.05,y:.05,width:w-.1,height:.5,fill:col,opacity:.25},f);
  if(kind==="grid"){for(let r=0;r<4;r++)for(let c=0;c<4;c++)el("rect",{x:.1+c*(w-.2)/4,y:.1+r*.1,width:(w-.2)/4-.02,height:.08,fill:(r==0||c==0)?col:"#e2e8f0",opacity:(r==0||c==0)?.9:.35},f)}
  else for(let k=0;k<3;k++)el("rect",{x:.12,y:.14+k*.12,width:(w-.3)*(0.5+((k*7+Math.round(x*3))%5)/10),height:.05,fill:col,opacity:.8},f);
}
function keyboard(g,x,y,z){box(g,x,y,z,.7,.25,.04,"#cbd5e1");box(g,x+.85,y+.05,z,.18,.25,.04,"#cbd5e1")}
function chair(g,x,y,col="#334155"){
  shadow(g,x,y,.7,.7);
  box(g,x+.3,y+.3,0,.1,.1,.55,"#64748b");
  box(g,x+.05,y+.05,.55,.6,.6,.12,col);
  box(g,x+.05,y+.55,.67,.6,.1,.7,col);
}
function plant(g,x,y,big=false){
  const r=big?.6:.45;shadow(g,x,y,r,r);
  box(g,x,y,0,r,r,r*.9,"#e2e8f0",{T:"#5b3a1e"});
  const c=P(x+r/2,y+r/2,r*.9+(big?1.1:.8));
  [[0,0,big?16:12,"#15803d"],[-9,6,big?11:8,"#16a34a"],[9,5,big?11:8,"#22c55e"],[0,-9,big?9:7,"#4ade80"]].forEach(([dx,dy,rr,cc])=>el("circle",{cx:c[0]+dx,cy:c[1]+dy,r:rr,fill:cc},g));
}
function rug(g,x,y,w,d,col,label){
  const q=el("g",{transform:floorT,class:"rug"},g);
  el("rect",{x,y,width:w,height:d,rx:.1,fill:col,opacity:.22},q);
  el("rect",{x,y,width:w,height:d,rx:.1,fill:"none",stroke:col,"stroke-width":.1},q);
  el("rect",{x:x+.12,y:y+d-.8,width:w-.24,height:.7,rx:.08,fill:col},q);
  const t=el("text",{x:x+w/2,y:y+d-.27,"text-anchor":"middle","font-size":.5,"font-weight":800,fill:"#0b1220"},q);t.textContent=label;
}
function bookshelf(g,x,y,w,col){
  shadow(g,x,y,w,.6);
  box(g,x,y,0,w,.6,2.8,"#8b5e3c",{T:"#a06f45"});
  const cols=[col,"#ef4444","#eab308","#3b82f6","#f97316","#22c55e","#a855f7"];
  for(let k=0;k<3;k++){box(g,x+.08,y+.05,.25+k*.85,w-.16,.5,.06,"#c9a07a");
    let bx=x+.15;let i=0;while(bx<x+w-.3){const bw=.15+((k*3+i)%3)*.05;box(g,bx,y+.1,.31+k*.85,bw,.4,.45+((i+k)%3)*.1,cols[(i+k*2)%cols.length]);bx+=bw+.04;i++}}
}
function archive(g,x,y,w,col){ // 檔案櫃＋檔案盒
  shadow(g,x,y,w,.7);
  box(g,x,y,0,w,.7,2.6,"#64748b",{T:"#94a3b8"});
  const cols=[col,"#f59e0b","#fde68a","#fdba74"];
  for(let k=0;k<3;k++){box(g,x+.06,y+.05,.15+k*.8,w-.12,.6,.05,"#cbd5e1");
    let bx=x+.12;let i=0;while(bx<x+w-.45){box(g,bx,y+.1,.2+k*.8,.38,.5,.6,cols[(i+k)%cols.length]);
      const f=faceL(g,bx,y+.6,.2+k*.8);el("rect",{x:.06,y:.15,width:.26,height:.08,fill:"#fff",opacity:.85},f);bx+=.44;i++}}
}
function cabinet(g,x,y,col){ // 矮檔案櫃
  shadow(g,x,y,1,.8);box(g,x,y,0,1,.8,1.3,"#94a3b8",{T:"#cbd5e1"});
  for(let k=0;k<3;k++){const f=faceL(g,x,y+.8,.1+k*.4);el("rect",{x:.1,y:.05,width:.8,height:.28,fill:"#64748b"},f);el("rect",{x:.4,y:.15,width:.2,height:.05,fill:col},f)}
}
function whiteboard(g,x,y,w,col){
  shadow(g,x,y,w,.3);
  box(g,x+.1,y+.1,0,.08,.08,1.2,"#94a3b8");box(g,x+w-.18,y+.1,0,.08,.08,1.2,"#94a3b8");
  box(g,x,y,1.2,w,.12,2,"#f8fafc",{L:"#f1f5f9"});
  const f=faceL(g,x,y+.12,1.2);
  el("rect",{x:0,y:0,width:w,height:2,fill:"#fff",stroke:"#cbd5e1","stroke-width":.03},f);
  el("rect",{x:0,y:1.85,width:w,height:.15,fill:col},f);
  el("polyline",{points:"0.2,1.4 0.6,0.9 1.0,1.2 1.5,0.5 2.0,0.8 2.5,0.4",fill:"none",stroke:col,"stroke-width":.06},f);
  [[.2,.3,"#ef4444"],[.2,.5,"#1e293b"],[.2,.7,"#1e293b"]].forEach(([a,b,c])=>el("rect",{x:a,y:b,width:.9-b*.4,height:.07,fill:c},f));
}
function printer(g,x,y,col){
  shadow(g,x,y,1.3,1.1);
  box(g,x,y,0,1.3,1.1,.75,"#cbd5e1",{T:"#e2e8f0"});
  box(g,x+.15,y+.1,.75,1,.5,.08,"#f8fafc");
  box(g,x+.2,y+.75,.4,.9,.3,.25,"#94a3b8");
  const f=faceL(g,x,y+1.1,.2);el("rect",{x:.15,y:.05,width:.9,height:.18,fill:"#1e293b"},f);el("rect",{x:.2,y:.09,width:.5,height:.1,fill:col},f);
}
function flaskSet(g,x,y,z,col){
  const draw=(cx,cy,sc,c)=>{const b=P(cx,cy,z);
    el("path",{d:`M${b[0]-4*sc},${b[1]-30*sc} h${8*sc} v${11*sc} l${11*sc},${17*sc} a${3*sc},${3*sc} 0 0 1 -${3*sc},${5*sc} h-${24*sc} a${3*sc},${3*sc} 0 0 1 -${3*sc},-${5*sc} l${11*sc},-${17*sc}z`,fill:"#f8fafccc",stroke:"#cbd5e1","stroke-width":.8},g);
    el("path",{d:`M${b[0]-10*sc},${b[1]-8*sc} h${20*sc} l${3*sc},${5*sc} a${3*sc},${3*sc} 0 0 1 -${3*sc},${5*sc} h-${24*sc} a${3*sc},${3*sc} 0 0 1 -${3*sc},-${5*sc}z`,fill:c},g);
    el("circle",{cx:b[0]+2*sc,cy:b[1]-12*sc,r:1.5*sc,fill:"#fff",opacity:.8},g)};
  draw(x,y,.75,col);draw(x+.6,y+.2,.9,"#22d3ee");draw(x+1.2,y,.7,"#f472b6");
  box(g,x+1.6,y-.1,z,.5,.5,.55,"#334155",{T:"#475569"});box(g,x+1.65,y-.05,z+.55,.4,.4,.05,"#f59e0b");
}
function bigScreen(g,x,y,col){
  shadow(g,x,y,3.2,.3);
  box(g,x+1.4,y+.1,0,.4,.2,.4,"#475569");box(g,x+1.55,y+.15,.4,.1,.1,1.1,"#64748b");
  box(g,x,y,1.5,3.2,.1,1.9,"#111827");
  const f=faceL(g,x,y+.1,1.5);
  el("rect",{x:.08,y:.08,width:3.04,height:1.74,fill:"#0b1220"},f);
  el("rect",{x:.08,y:.08,width:3.04,height:1.74,fill:col,opacity:.12},f);
  [[.3,.9],[.6,1.3],[.9,.7],[1.2,1.5],[1.5,1.1]].forEach(([bx,h])=>el("rect",{x:bx,y:1.7-h,width:.2,height:h,fill:col,opacity:.9},f));
  el("polyline",{points:"1.9,1.4 2.2,1.0 2.5,1.15 2.8,.5 3.0,.7",fill:"none",stroke:"#38bdf8","stroke-width":.06},f);
  el("rect",{x:1.9,y:.2,width:1.1,height:.12,fill:"#e2e8f0",opacity:.8},f);
  el("rect",{x:1.9,y:.4,width:.7,height:.08,fill:"#94a3b8"},f);
}
function sofa(g,x,y,len=3.2){
  shadow(g,x,y,len,1.2);
  const c="#3b82f6",d="#2563eb";
  box(g,x,y,0,len,1.2,.55,c,{T:"#60a5fa"});box(g,x,y,.55,len,.35,.7,d);
  box(g,x,y,.55,.3,1.2,.35,d);box(g,x+len-.3,y,.55,.3,1.2,.35,d);
  for(let a=.5;a<len-.9;a+=1.1)box(g,x+a,y+.35,.55,.8,.8,.2,"#93c5fd");
}
function coffeeTable(g,x,y){shadow(g,x,y,1.6,1);[[.1,.1],[1.4,.1],[.1,.8],[1.4,.8]].forEach(([a,b])=>box(g,x+a,y+b,0,.1,.1,.5,"#64748b"));
  box(g,x,y,.5,1.6,1,.08,"#a16207",{T:"#ca8a04"});box(g,x+.5,y+.3,.58,.3,.3,.25,"#f8fafc");box(g,x+1,y+.4,.58,.25,.25,.2,"#f8fafc")}
function roundTable(g,x,y){
  shadow(g,x,y,2,2);
  box(g,x+.85,y+.85,0,.3,.3,.9,"#64748b");
  const cx=x+1,cy=y+1,rx=1.2247*S,ry=.707*S;
  const lo=P(cx,cy,.8),hi=P(cx,cy,.92);
  el("rect",{x:lo[0]-rx,y:hi[1],width:2*rx,height:lo[1]-hi[1],fill:"#92400e"},g);
  el("ellipse",{cx:lo[0],cy:lo[1],rx,ry,fill:"#92400e"},g);
  el("ellipse",{cx:hi[0],cy:hi[1],rx,ry,fill:"#d97706"},g);
  el("ellipse",{cx:hi[0],cy:hi[1],rx:rx*.35,ry:ry*.35,fill:"#fbbf24",opacity:.5},g);
  [[x+1,y-.2],[x+2.2,y+1],[x+1,y+2.2],[x-.2,y+1]].forEach(([a,b])=>chair(g,a-.35,b-.35,"#475569"));
}
function waterCooler(g,x,y){shadow(g,x,y,.6,.6);box(g,x,y,0,.6,.6,1.3,"#e2e8f0");box(g,x+.1,y+.1,1.3,.4,.4,.7,"#bae6fd",{T:"#7dd3fc"});box(g,x+.15,y+.55,1.0,.3,.1,.1,"#38bdf8")}
function door(g,y0,col,label,locked){
  const q=el("g",{transform:leftT},g);
  el("rect",{x:y0,y:0,width:1.6,height:3.2,fill:"#1e293b",stroke:"#64748b","stroke-width":.06},q);
  el("rect",{x:y0+.12,y:.12,width:1.36,height:2.96,fill:"#334155"},q);
  el("rect",{x:y0+.25,y:.35,width:1.1,height:1.1,fill:locked?"#475569":"#7dd3fc",opacity:locked?1:.6},q);
  el("rect",{x:y0+.25,y:1.65,width:1.1,height:1.2,fill:"#475569"},q);
  el("circle",{cx:y0+1.3,cy:1.75,r:.08,fill:"#fbbf24"},q);
  el("rect",{x:y0-.2,y:3.35,width:2,height:.5,rx:.08,fill:col},q);
  const qt=el("g",{transform:"scale(-1,-1)"},q);
  const t=el("text",{x:-(y0+.8),y:-3.5,"text-anchor":"middle","font-size":.34,"font-weight":700,fill:"#0b1220"},qt);t.textContent=label;
  const k=el("text",{x:-(y0+.8),y:-4.05,"text-anchor":"middle","font-size":.36,fill:"#fbbf24"},qt);k.textContent=locked?"🔒":"🔓";
}

/* ---------- 房間 ---------- */
function buildRoom(key){
  const cfg=ROOMS[key], root=document.getElementById(key);
  svg=root.querySelector("svg"); N=cfg.N;
  const defs=el("defs",{});
  const fl=el("linearGradient",{id:key+"floor",x1:"0",y1:"0",x2:"1",y2:"1"},defs);
